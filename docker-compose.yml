services:
  inboxops:
    build: .
    ports: ["8000:8000"]
    env_file: backend/.env
    volumes:
      - inboxops-data:/app/backend/data
      - inboxops-secrets:/app/backend/secrets
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  inboxops-data:
  inboxops-secrets:
